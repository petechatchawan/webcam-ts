<div
	class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 dark:from-gray-900 dark:to-slate-900 p-3 pb-24 sm:p-4 sm:pb-6 lg:p-6">
	<!-- Header - Simplified -->
	<header class="max-w-7xl mx-auto mb-4 sm:mb-6">
		<div
			class="bg-white dark:bg-slate-800 rounded-xl sm:rounded-2xl shadow-sm p-4 flex flex-row gap-3 items-center justify-between">
			<div class="flex items-center gap-3">
				<div
					class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-md">
					<span class="material-symbols-rounded text-white text-xl sm:text-2xl">photo_camera</span>
				</div>
				<div>
					<h1 class="text-lg sm:text-xl font-bold text-gray-900 dark:text-white">Webcam-TS</h1>
					<p class="text-xs text-gray-500 dark:text-gray-400">Camera Control</p>
				</div>
			</div>

			<div class="flex items-center gap-2 sm:gap-3">
				<!-- Status Badge - Show on all screens -->
				<div
					class="flex items-center gap-2 px-2 sm:px-3 py-1.5 rounded-lg bg-gray-50 dark:bg-slate-700/50">
					<div
						class="w-2 h-2 rounded-full"
						[ngClass]="{
							'bg-green-500 animate-pulse': status() === 'ready',
							'bg-amber-500': status() === 'initializing',
							'bg-red-500': status() === 'error',
							'bg-gray-400': status() === 'idle'
						}"></div>
					<span class="text-xs font-medium text-gray-700 dark:text-gray-300 capitalize">
						{{ status() }}
					</span>
				</div>

				<!-- GitHub Link -->
				<a
					href="https://github.com/petechatchawan/webcam-ts"
					target="_blank"
					class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors flex items-center justify-center text-gray-600 dark:text-gray-400">
					<svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24">
						<path
							fill-rule="evenodd"
							d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
							clip-rule="evenodd" />
					</svg>
				</a>
			</div>
		</div>
	</header>

	<!-- Main Content -->
	<main class="max-w-7xl mx-auto">
		<div
			class="grid grid-cols-1 gap-6 sm:gap-8 lg:grid-cols-3"
			[style]="{ '--p-primary-color': 'rgb(59 130 246)', '--p-primary-contrast-color': '#ffffff' }">
			<!-- Video Section - Takes 2 columns on desktop -->
			<div class="space-y-6 lg:col-span-2">
				<!-- Video Container -->
				<div
					class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60 overflow-hidden flex flex-col">
					<app-webcam-preview
						class="w-full relative block"
						[isLoading]="uiState().isLoading"
						[isReady]="uiState().isReady"
						[isStartingCamera]="isStartingCamera()"
						[error]="error()"
						[errorTitle]="errorTitle()"
						[errorDetails]="errorDetails()"
						[permissionState]="permissionState()"
						[canStart]="uiState().canStart"
						[enableMirror]="enableMirror()"
						[resolution]="selectedResolution()"
						(startCamera)="startCamera()"
						(requestPermissions)="requestPermissions()"
						(showPermissionGuidance)="showPermissionGuidance()"
						#preview></app-webcam-preview>

					<app-webcam-controls
						class="w-full"
						[cameraName]="getCurrentCameraName()"
						[resolution]="selectedResolution()"
						[canStart]="uiState().canStart"
						[canCapture]="uiState().canCapture"
						[canStop]="uiState().canStop"
						[isStartingCamera]="isStartingCamera()"
						(startCamera)="startCamera()"
						(stopCamera)="stopCamera()"
						(captureImage)="captureImage()"></app-webcam-controls>
				</div>

				<!-- Gallery -->
				<div
					*ngIf="capturedImageUrl()"
					class="bg-white dark:bg-slate-800 rounded-xl sm:rounded-2xl shadow-sm p-4 sm:p-5">
					<div class="flex items-center justify-between mb-4">
						<h3
							class="text-base sm:text-lg font-semibold text-gray-900 dark:text-white flex items-center gap-2">
							<span class="material-symbols-rounded text-blue-500 text-xl">photo_library</span>
							ภาพถ่าย
						</h3>
						<p-button severity="danger" size="small" [text]="true" (onClick)="clearCapturedImage()">
							<span class="material-symbols-rounded text-base">delete</span>
						</p-button>
					</div>
					<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
						<div
							class="relative group rounded-lg overflow-hidden bg-gray-100 dark:bg-slate-700 aspect-video">
							<p-image
								[src]="capturedImageUrl()!"
								alt="Captured"
								[preview]="true"
								imageClass="w-full h-full object-cover"></p-image>
							<a
								[href]="capturedImageUrl()"
								download="capture.png"
								class="absolute top-2 right-2 w-8 h-8 rounded-full bg-black/50 hover:bg-black/70 text-white flex items-center justify-center transition-colors">
								<span class="material-symbols-rounded text-sm">download</span>
							</a>
						</div>
					</div>
				</div>
			</div>

			<!-- Controls Section - Takes 1 column on desktop -->
			<div class="space-y-6">
				<app-webcam-settings
					[devices]="devices()"
					[selectedDevice]="selectedDevice()"
					[resolutionGroups]="resolutionGroups"
					[selectedResolution]="selectedResolution()"
					[isLoading]="uiState().isLoading"
					[isReady]="uiState().isReady"
					[enableMirror]="enableMirror()"
					[enableAudio]="enableAudio()"
					[enableTorch]="enableTorch()"
					[zoomValue]="zoomValue()"
					[minZoom]="minZoom()"
					[maxZoom]="maxZoom()"
					[deviceCapability]="webcamService.deviceCapability()"
					(deviceChange)="onDeviceChange($event)"
					(resolutionChange)="onResolutionChangeDirect($event)"
					(mirrorChange)="onMirrorChange($event)"
					(audioChange)="toggleAudio($event)"
					(torchChange)="toggleTorch($event)"
					(zoomChange)="onZoomChange($event)"></app-webcam-settings>

				<app-webcam-diagnostics
					[deviceType]="getDeviceType()"
					[cameraName]="getCurrentCameraName()"
					[resolution]="selectedResolution()"
					[deviceCapability]="webcamService.deviceCapability()"
					[minZoom]="minZoom()"
					[maxZoom]="maxZoom()"
					[selectedDevice]="selectedDevice()"
					[selectDeviceDetails]="selectDeviceDetails()"
					[deviceCapabilitiesTestResult]="deviceCapabilitiesTestResult()"
					(testSelectDevice)="testSelectDevice($event)"
					(testDeviceCapabilities)="testDeviceCapabilities()"></app-webcam-diagnostics>
			</div>
		</div>
	</main>
</div>

<!-- Confirmation Dialog for Gallery Delete -->
<p-confirmDialog
	header="ยืนยันการลบรูปภาพ"
	icon="material-symbols-rounded text-red-500 text-3xl"
	[style]="{ width: '50vw' }"></p-confirmDialog>
