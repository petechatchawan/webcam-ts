<div class="space-y-6">
	<!-- Device Settings -->
	<div
		class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60 p-5 sm:p-6 lg:p-7">
		<h3 class="text-base font-semibold text-gray-900 dark:text-white mb-5 flex items-center gap-2">
			<span class="material-symbols-rounded text-blue-500 text-xl">settings</span>
			ตั้งค่า
		</h3>

		<div class="space-y-4">
			<!-- Camera Select -->
			<div>
				<label
					for="camera-select"
					class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-2">
					กล้อง
				</label>
				<p-select
					inputId="camera-select"
					[options]="devices()"
					[ngModel]="selectedDevice()"
					optionLabel="label"
					placeholder="เลือกกล้อง"
					(onChange)="deviceChange.emit($event.value)"
					styleClass="w-full"
					dataKey="deviceId"
					[disabled]="isLoading()">
					<ng-template pTemplate="selectedItem" let-d>
						<div class="flex items-center gap-2">
							<span class="material-symbols-rounded text-blue-500 text-base">videocam</span>
							<span class="text-sm truncate">{{ d?.label }}</span>
						</div>
					</ng-template>
					<ng-template pTemplate="item" let-d>
						<div class="flex items-center gap-2 py-1">
							<span class="text-sm truncate">{{ d.label }}</span>
						</div>
					</ng-template>
				</p-select>
			</div>

			<!-- Resolution Select with Groups -->
			<div>
				<label
					for="resolution-select"
					class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-2">
					ความละเอียด
				</label>
				<p-select
					inputId="resolution-select"
					[options]="resolutionGroups()"
					[ngModel]="selectedResolution()"
					[group]="true"
					optionLabel="label"
					optionGroupLabel="label"
					optionGroupChildren="items"
					placeholder="เลือกความละเอียด"
					(onChange)="resolutionChange.emit($event.value)"
					styleClass="w-full"
					[disabled]="isLoading()">
					<ng-template pTemplate="group" let-group>
						<div class="flex items-center gap-2 px-1">
							<span class="font-bold">{{ group.label }}</span>
						</div>
					</ng-template>
					<ng-template pTemplate="selectedItem" let-r>
						<div class="flex items-center gap-2">
							<span class="text-sm">
								{{ r?.label }}
								<span class="text-gray-400 text-xs">({{ r?.width }}x{{ r?.height }})</span>
							</span>
						</div>
					</ng-template>
				</p-select>
			</div>

			<!-- Toggles -->
			<div class="space-y-3 pt-2">
				<div
					class="flex items-center justify-between p-3 rounded-lg bg-gray-50 dark:bg-slate-700/50">
					<div class="flex items-center gap-3">
						<span class="material-symbols-rounded text-blue-500 text-xl">flip</span>
						<span class="text-sm font-medium text-gray-700 dark:text-gray-300">สะท้อนกระจก</span>
					</div>
					<p-toggleswitch
						[ngModel]="enableMirror()"
						(onChange)="mirrorChange.emit($event.checked)"></p-toggleswitch>
				</div>

				<div
					class="flex items-center justify-between p-3 rounded-lg bg-gray-50 dark:bg-slate-700/50">
					<div class="flex items-center gap-3">
						<span class="material-symbols-rounded text-blue-500 text-xl">volume_up</span>
						<span class="text-sm font-medium text-gray-700 dark:text-gray-300">เสียง</span>
					</div>
					<p-toggleswitch
						[ngModel]="enableAudio()"
						(onChange)="audioChange.emit($event.checked)"></p-toggleswitch>
				</div>
			</div>
		</div>
	</div>

	<!-- Advanced Controls -->
	<div
		*ngIf="deviceCapability()?.hasTorch || deviceCapability()?.hasZoom"
		class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60 p-5 sm:p-6 lg:p-7">
		<h3 class="text-base font-semibold text-gray-900 dark:text-white mb-5 flex items-center gap-2">
			<span class="material-symbols-rounded text-blue-500 text-xl">tune</span>
			ขั้นสูง
		</h3>

		<div class="space-y-3">
			<!-- Torch -->
			<div
				*ngIf="deviceCapability()?.hasTorch"
				class="flex items-center justify-between p-3 rounded-lg bg-gray-50 dark:bg-slate-700/50">
				<div class="flex items-center gap-3">
					<span class="material-symbols-rounded text-amber-500 text-xl">flashlight_on</span>
					<span class="text-sm font-medium text-gray-700 dark:text-gray-300">ไฟแฟลช</span>
				</div>
				<p-toggleswitch
					[ngModel]="enableTorch()"
					(onChange)="torchChange.emit($event.checked)"
					[disabled]="!isReady()"></p-toggleswitch>
			</div>

			<!-- Zoom -->
			<div *ngIf="deviceCapability()?.hasZoom && minZoom() !== null" class="space-y-2">
				<div class="flex justify-between items-center">
					<span class="text-xs font-medium text-gray-600 dark:text-gray-400">ซูม</span>
					<span
						class="text-xs font-semibold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded">
						{{ zoomValue() }}x
					</span>
				</div>
				<p-slider
					[ngModel]="zoomValue()"
					[min]="minZoom()!"
					[max]="maxZoom()!"
					[step]="0.1"
					(onChange)="zoomChange.emit($any($event).value)"
					[disabled]="!isReady()"></p-slider>
			</div>
		</div>
	</div>
</div>
