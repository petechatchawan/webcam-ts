<div
	class="p-4 sm:p-5 border-t border-slate-100 dark:border-slate-700/60 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between bg-white dark:bg-slate-800">
	<div class="flex items-center gap-4 min-w-0">
		<div
			class="w-10 h-10 rounded-full bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center">
			<span class="material-symbols-rounded text-blue-600 dark:text-blue-400">videocam</span>
		</div>
		<div class="flex flex-col min-w-0">
			<span class="text-sm font-semibold text-gray-900 dark:text-white truncate">
				{{ cameraName() || "กล้อง" }}
			</span>
			<span class="text-xs text-gray-500 dark:text-gray-400">
				{{ resolution().width }}x{{ resolution().height }}
			</span>
		</div>
	</div>

	<div class="hidden sm:flex sm:items-center sm:gap-2">
		<p-button
			(onClick)="startCamera.emit()"
			[disabled]="!canStart() || isStartingCamera()"
			styleClass="!w-10 !h-10 !p-0 rounded-full"
			pTooltip="เปิดกล้อง"
			tooltipPosition="top">
			<span class="material-symbols-rounded">play_arrow</span>
		</p-button>

		<p-button
			(onClick)="captureImage.emit()"
			[disabled]="!canCapture()"
			severity="secondary"
			styleClass="!w-10 !h-10 !p-0 rounded-full"
			pTooltip="ถ่ายภาพ"
			tooltipPosition="top">
			<span class="material-symbols-rounded">camera_alt</span>
		</p-button>

		<p-button
			(onClick)="stopCamera.emit()"
			[disabled]="!canStop()"
			severity="danger"
			styleClass="!w-10 !h-10 !p-0 rounded-full"
			pTooltip="ปิดกล้อง"
			tooltipPosition="top">
			<span class="material-symbols-rounded">stop</span>
		</p-button>
	</div>
</div>

<!-- Mobile Quick Bar -->
<div
	class="fixed inset-x-0 bottom-0 z-40 border-t border-slate-200 dark:border-slate-700/80 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md p-3 pb-[calc(14px+env(safe-area-inset-bottom))] sm:hidden shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)]">
	<div class="mx-auto max-w-7xl grid grid-cols-3 gap-3">
		<button
			type="button"
			class="h-11 rounded-lg bg-blue-600 text-white text-xs font-semibold flex items-center justify-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed"
			(click)="startCamera.emit()"
			[disabled]="!canStart() || isStartingCamera()">
			<span class="material-symbols-rounded text-base">play_arrow</span>
			<span>{{ isStartingCamera() ? "รอ..." : "เริ่ม" }}</span>
		</button>
		<button
			type="button"
			class="h-11 rounded-lg bg-slate-100 dark:bg-slate-700 text-gray-800 dark:text-gray-100 text-xs font-semibold flex items-center justify-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed"
			(click)="captureImage.emit()"
			[disabled]="!canCapture()">
			<span class="material-symbols-rounded text-base">camera_alt</span>
			<span>ถ่าย</span>
		</button>
		<button
			type="button"
			class="h-11 rounded-lg bg-red-600 text-white text-xs font-semibold flex items-center justify-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed"
			(click)="stopCamera.emit()"
			[disabled]="!canStop()">
			<span class="material-symbols-rounded text-base">stop</span>
			<span>หยุด</span>
		</button>
	</div>
</div>
