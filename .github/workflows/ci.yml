name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify v4 package and playground
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify playground clean room
        run: node scripts/verify-playground-clean-room.mjs

      - name: Typecheck package
        run: pnpm --dir packages/webcam-ts typecheck

      - name: Test package and packed exports
        run: pnpm --dir packages/webcam-ts test

      - name: Verify package tarball
        run: cd packages/webcam-ts && npm pack --dry-run

      - name: Typecheck playground
        run: pnpm --dir apps/playground typecheck

      - name: Test playground
        run: pnpm --dir apps/playground test

      - name: Build GitHub Pages artifact
        run: pnpm --dir apps/playground build
        env:
          GITHUB_ACTIONS: "true"

      - name: Commit verified lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh playground lockfile"
          git push origin HEAD:${GITHUB_HEAD_REF}
