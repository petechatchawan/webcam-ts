name: Update PR2 lockfile

on:
  pull_request:
    paths:
      - apps/playground/package.json
      - .github/workflows/update-pr2-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/webcam-ts-v4-browser-conformance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'agent/webcam-ts-v4-browser-conformance' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only

      - name: Commit lockfile when changed
        env:
          TARGET_BRANCH: ${{ github.head_ref || 'agent/webcam-ts-v4-browser-conformance' }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh Playwright lockfile"
          git push origin "HEAD:${TARGET_BRANCH}"
