name: Browser Conformance

on:
  pull_request:
    paths:
      - "packages/webcam-ts/**"
      - "apps/playground/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/browser-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.browser }} conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Webcam-TS package
        run: pnpm --dir packages/webcam-ts build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser conformance
        run: pnpm --dir apps/playground test:browser:${{ matrix.browser }}
